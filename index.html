<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#cddff4">
  <title>Calendario de Adviento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main class="page">
    <header class="hero">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </header>

    <!-- Árbol blanco: los 24 adornos "fantasma" se convierten en adornos de color al abrir cada casilla -->
    <section class="tree-wrap">
      <svg id="tree" viewBox="0 0 400 520" role="img" aria-label="Árbol de Navidad blanco que se decora con cada casilla que abres">
        <defs>
          <linearGradient id="treeFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#e8eefb"/>
          </linearGradient>
          <radialGradient id="starGlow">
            <stop offset="0" stop-color="#fff6cf" stop-opacity=".95"/>
            <stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
          </radialGradient>
          <filter id="treeShadow" x="-20%" y="-10%" width="140%" height="130%">
            <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#8aa0d6" flood-opacity=".28"/>
          </filter>
        </defs>

        <!-- nieve en el suelo y tronco -->
        <ellipse cx="200" cy="498" rx="170" ry="15" fill="#fff" opacity=".8"/>
        <rect x="183" y="452" width="34" height="44" rx="6" fill="#d8c7c4"/>

        <!-- pisos del árbol -->
        <g filter="url(#treeShadow)" fill="url(#treeFill)" stroke="#cbd7ee" stroke-width="2" stroke-linejoin="round">
          <path d="M200 270 L365 455 Q200 488 35 455 Z"/>
          <path d="M200 190 L330 360 Q200 392 70 360 Z"/>
          <path d="M200 120 L300 262 Q200 292 100 262 Z"/>
          <path d="M200 62 L272 172 Q200 195 128 172 Z"/>
        </g>
        <!-- sombreado suave -->
        <g fill="none" stroke="#dfe7f7" stroke-width="3" stroke-linecap="round">
          <path d="M138 166 Q200 186 262 166"/>
          <path d="M110 256 Q200 284 290 256"/>
          <path d="M82 354 Q200 384 318 354"/>
          <path d="M46 449 Q200 480 354 449"/>
        </g>

        <!-- guirnaldas de cuentas -->
        <g fill="none" stroke-linecap="round">
          <path d="M146 150 Q200 170 254 150" stroke="#eadff0" stroke-width="1.5"/>
          <path d="M146 150 Q200 170 254 150" stroke="#f4b6cb" stroke-width="5" stroke-dasharray="0.1 10"/>
          <path d="M134 220 Q200 244 266 220" stroke="#eadff0" stroke-width="1.5"/>
          <path d="M134 220 Q200 244 266 220" stroke="#c9b9ee" stroke-width="5" stroke-dasharray="0.1 10"/>
          <path d="M94 335 Q200 372 306 335" stroke="#eadff0" stroke-width="1.5"/>
          <path d="M94 335 Q200 372 306 335" stroke="#a9d8c4" stroke-width="5" stroke-dasharray="0.1 10"/>
          <path d="M74 414 Q200 436 326 414" stroke="#eadff0" stroke-width="1.5"/>
          <path d="M74 414 Q200 436 326 414" stroke="#f9cfae" stroke-width="5" stroke-dasharray="0.1 10"/>
        </g>

        <!-- adornos (los genera app.js) -->
        <g id="ornaments"></g>

        <!-- regalos al pie del árbol -->
        <g transform="translate(74 470)">
          <rect width="42" height="30" rx="4" fill="#f8d3df"/>
          <rect x="18" width="6" height="30" fill="#fff"/>
          <rect y="11" width="42" height="6" fill="#fff"/>
          <ellipse cx="14" cy="-2" rx="8" ry="5" fill="#fff"/>
          <ellipse cx="28" cy="-2" rx="8" ry="5" fill="#fff"/>
          <circle cx="21" cy="0" r="3.5" fill="#f4b6cb"/>
        </g>
        <g transform="translate(284 478)">
          <rect width="36" height="24" rx="4" fill="#cfe3f7"/>
          <rect x="15" width="6" height="24" fill="#fff"/>
          <rect y="9" width="36" height="5" fill="#fff"/>
          <ellipse cx="11" cy="-2" rx="7" ry="4.5" fill="#fff"/>
          <ellipse cx="25" cy="-2" rx="7" ry="4.5" fill="#fff"/>
          <circle cx="18" cy="0" r="3" fill="#c9b9ee"/>
        </g>
        <g transform="translate(250 486)">
          <rect width="26" height="16" rx="3" fill="#d3efe4"/>
          <rect x="10" width="5" height="16" fill="#fff"/>
          <rect y="6" width="26" height="4" fill="#fff"/>
        </g>

        <g id="sparkles"></g>

        <!-- estrella -->
        <circle cx="200" cy="48" r="34" fill="url(#starGlow)" class="star-glow"/>
        <polygon points="200,26 205.3,40.7 220.9,41.2 208.6,50.8 212.9,65.8 200,57 187.1,65.8 191.4,50.8 179.1,41.2 194.7,40.7"
                 fill="#fbe3a5" stroke="#fbe3a5" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </section>

    <section class="status" aria-live="polite">
      <div class="label" id="stLabel"></div>
      <div class="count" id="stCount"></div>
      <div class="sub" id="stSub"></div>
      <div class="progress"><i id="stBar"></i></div>
      <div class="progress-text" id="stProg"></div>
    </section>

    <div class="doors" id="doors"></div>
  </main>

  <div class="ground">
    <svg class="hills" viewBox="0 0 1200 180" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70 C200 20 380 30 560 70 S960 120 1200 50 L1200 180 L0 180Z" fill="#e6edfa"/>
      <path d="M0 110 C220 60 420 80 640 105 S1000 130 1200 85 L1200 180 L0 180Z" fill="#f3f6fd"/>
      <path d="M0 140 C260 110 520 130 760 140 S1060 150 1200 130 L1200 180 L0 180Z" fill="#fff"/>
    </svg>
    <p class="foot" id="footer"></p>
  </div>

  <dialog id="modal" aria-label="Sorpresa del día">
    <button class="close" type="button" aria-label="Cerrar">×</button>
    <div class="sheet"><div class="sheet-body" id="content"></div></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <noscript><p style="text-align:center;padding:24px">Este calendario necesita JavaScript para funcionar.</p></noscript>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
