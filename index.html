    <!-- Árbol blanco: los 24 adornos "fantasma" se convierten en adornos de color al abrir cada casilla -->
    <section class="tree-wrap">
      <svg id="tree" viewBox="0 0 400 520" role="img" aria-label="Árbol de Navidad blanco que se decora con cada casilla que abres">

            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#e8eefb"/>

          <linearGradient id="treeShade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity=".65"/>
            <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#8fa6d8" stop-opacity=".36"/>

          <linearGradient id="starFill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff0b8"/>
            <stop offset="1" stop-color="#f6d57a"/>
          </linearGradient>
          <radialGradient id="starGlow">
            <stop offset="0" stop-color="#fff6cf" stop-opacity=".95"/>
            <stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
          </radialGradient>
          <filter id="treeShadow" x="-20%" y="-10%" width="140%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#7f97d2" flood-opacity=".42"/>
          </filter>
        </defs>
